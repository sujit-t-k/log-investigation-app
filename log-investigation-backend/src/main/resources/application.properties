spring.application.name=log-investigation-backend

# Explicitly import external database configuration from db-config.env as a properties file
spring.config.import=optional:file:./db-config.env[.properties]

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aji_log_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# ddl-auto is set to 'update' so that spring data jpa creates table if it is not present.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
